<div id="game-root">
    <header class="top-bar">
      <div class="top-group">
        <a href="/" class="btn-nav btn-top-home" title="返回主站">← 返回主页</a>
        <span class="stat-badge stat-hp" id="stat-hp">🩸 HP 80/80</span>
        <span class="stat-badge stat-gold" id="stat-gold">🪙 100</span>
        <span class="stat-badge" id="stat-floor" style="color:var(--cyan-glow);">🗺️ 第 1 / 15 层</span>
      </div>
      <div class="top-group">
        <div class="relics-bar" id="relics-bar"></div>
        <button class="btn-nav" id="btn-deck">📜 卡库全览</button>
        <button class="btn-nav" id="btn-map">🗺️ 路线图</button>
        <button class="btn-nav" id="btn-audio">🔊 音效:开</button>
        <button class="btn-nav" id="btn-help">❓ 指南</button>
      </div>
    </header>

    <main class="screen-container" id="char-select-screen">
      <h1 style="font-size: 32px; font-weight: 800; color: var(--gold); margin-bottom: 8px;">符文秘境：深渊之塔</h1>
      <p style="color: var(--text-muted); font-size: 15px;">选择踏入深渊裂隙的勇士，开启每一次截然不同的卡组构筑之旅</p>
      <div class="hero-cards-grid" id="hero-select-grid"></div>
    </main>

    <main class="screen-container" id="map-screen" style="display: none;"></main>
    <main class="screen-container" id="combat-screen" style="display: none;">
      <section class="battlefield">
        <div class="unit-platform" id="hero-platform">
          <div class="block-badge" id="hero-block" style="display: none;">🛡️ 0</div>
          <div class="unit-sprite" id="hero-sprite">🗡️</div>
          <div class="unit-name" id="hero-name">铁壁誓卫</div>
          <div class="hp-bar-wrap">
            <div class="hp-fill" id="hero-hp-fill" style="width: 100%;"></div>
            <div class="hp-text" id="hero-hp-text">80 / 80</div>
          </div>
          <div class="status-row" id="hero-status"></div>
        </div>

        <div class="unit-platform" id="enemy-platform">
          <div class="intent-indicator" id="enemy-intent">⚔️ 6</div>
          <div class="block-badge" id="enemy-block" style="display: none;">🛡️ 0</div>
          <div class="unit-sprite" id="enemy-sprite">🦇</div>
          <div class="unit-name" id="enemy-name">洞穴血蝠</div>
          <div class="hp-bar-wrap enemy">
            <div class="hp-fill" id="enemy-hp-fill" style="width: 100%;"></div>
            <div class="hp-text" id="enemy-hp-text">26 / 26</div>
          </div>
          <div class="status-row" id="enemy-status"></div>
        </div>
      </section>

      <section class="hand-area-wrap">
        <div class="combat-future-bar">
          <div class="energy-orb-sphere" id="energy-orb">3/3</div>
          <button class="pile-button" id="draw-pile-btn">抽牌 10</button>
          <button class="pile-button" id="discard-pile-btn">弃牌 0</button>
        </div>
        <div class="hand-cards-row" id="hand-cards-row"></div>
        <button class="btn-turn-end" id="end-turn-btn">结束回合 (Space)</button>
      </section>
    </main>
    <main class="screen-container" id="loot-screen" style="display: none; align-items: center; justify-content: center; gap: 20px;">
      <h2 style="font-size: 26px; color: var(--gold);">🎉 战斗胜利！</h2>
      <div id="loot-gold" style="font-size: 18px; color: var(--gold); font-weight: 700;">🪙 获得 25 金币</div>
      <p style="color: var(--text-muted);">从以下卡牌中挑选 1 张加入卡组：</p>
      <div id="loot-cards-row" style="display: flex; gap: 16px;"></div>
      <button class="btn-nav" id="btn-skip-loot" style="padding: 8px 24px; font-weight: 700;">跳过卡牌选择</button>
    </main>

    <main class="screen-container" id="campfire-screen" style="display: none; align-items: center; justify-content: center; gap: 24px;">
      <div style="font-size: 72px;">⛺</div>
      <h2 style="font-size: 28px; color: var(--gold);">深渊营火 · 休整</h2>
      <p style="color: var(--text-muted); max-width: 400px; text-align: center;">在深渊裂隙的微温营火旁，你可以选择短暂小憩恢复体力，或淬炼强化一张卡牌。</p>
      <div style="display: flex; gap: 20px;">
        <button class="btn-turn-end" id="btn-rest" style="position: static;">🛌 休息 (恢复 30% 生命值)</button>
        <button class="btn-turn-end" id="btn-forge" style="position: static; background: linear-gradient(135deg, #a855f7, #6366f1); color: #fff;">🔨 锻造 (升级一张卡牌+)</button>
      </div>
    </main>

    <main class="screen-container" id="shop-screen" style="display: none; align-items: center; justify-content: center; gap: 20px; padding: 20px;">
      <div style="font-size: 64px;">🏪</div>
      <h2 style="font-size: 26px; color: var(--gold);">深渊黑市商人</h2>
      <div id="shop-items-row" style="display: flex; gap: 16px; flex-wrap: wrap; justify-content: center;"></div>
      <button class="btn-nav" id="btn-leave-shop" style="padding: 8px 24px; font-weight: 700;">离开商店</button>
    </main>
    <main class="screen-container" id="event-screen" style="display: none; align-items: center; justify-content: center; gap: 20px; padding: 20px; text-align: center;">
      <h2 id="event-title" style="font-size: 26px; color: var(--gold);">古老神龛</h2>
      <p id="event-desc" style="color: var(--text-muted); max-width: 500px; line-height: 1.6;"></p>
      <div id="event-choices" style="display: flex; flex-direction: column; gap: 12px; align-items: center;"></div>
    </main>

    <main class="screen-container" id="gameover-screen" style="display: none; align-items: center; justify-content: center; gap: 20px;">
      <h1 id="gameover-title" style="font-size: 34px; color: var(--gold);">深渊登顶！</h1>
      <p style="color: var(--text-muted);">每一次旅程都是全新的试炼与构筑。</p>
      <div style="display: flex; gap: 16px;">
        <button class="btn-turn-end" id="btn-restart" style="position: static;">🔄 再次启程</button>
        <a href="/" class="btn-nav" style="padding: 12px 24px; font-weight: 700; align-self: center;">🏠 返回主页</a>
      </div>
    </main>

    <div class="modal-backdrop" id="modal-backdrop">
      <div class="modal-box">
        <h3 class="modal-title" id="modal-title">卡库全览</h3>
        <div id="modal-body"></div>
        <button class="btn-nav" id="modal-close" style="align-self: center; margin-top: 10px; padding: 6px 20px;">关闭</button>
      </div>
    </div>
  </div>
